name: Deploy (staging)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.basement.nugu.dev

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set SHORT_SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: "coutito"
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build + push image to dockerhub
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --tag coutito/basement-aws:staging-${{ env.SHORT_SHA }} \
          --target prod-final-bin .

        docker push coutito/basement-aws:staging-${{ env.SHORT_SHA }}

    - name: Deploy on staging server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull coutito/basement-aws:staging-${{ env.SHORT_SHA }}

          docker rm -f stage_basement || true

          docker run -d \
            --name stage_basement \
            -p 3002:5432 \
            coutito/basement-aws:staging-${{ env.SHORT_SHA }}
